# Hearsay on one Docker host: the browser app (web), the API (api), and the
# hourly collections sync (worker), sharing one SQLite database on a volume.
#
#   docker compose up -d --build
#
# Nothing needs configuring first: the first visit asks where Audiobookshelf is
# and for an ABS admin's login, and the rest is on the admin screen. Settings
# can also come from hearsay.env (see hearsay.env.example), if it exists.
#
# HEARSAY_PORT, ABS_PUBLIC_URL (only if browsers reach ABS at another address
# than the one the server saves) and FIIG_IMAGE (the fiig release the backend
# runs on, pinned below) can go in a .env file next to this one.
#
# Point your reverse proxy (with HTTPS) at port 47281; that is the only port
# published. The API and worker are reachable only from the web container.
name: hearsay

x-backend: &backend
  build:
    context: ./backend
    args:
      FIIG_IMAGE: ${FIIG_IMAGE:-ghcr.io/elephantryan/fiig:v0.1.0-alpha.4}
  image: hearsay-backend
  env_file:
    - path: hearsay.env
      required: false
  volumes:
    - hearsay-data:/data
  restart: unless-stopped

services:
  api:
    <<: *backend
    command: ["serve", "-caps", "/app/caps.container.json", "/app", "web"]

  worker:
    <<: *backend
    command: ["serve", "-caps", "/app/caps.container.json", "/app", "worker"]
    depends_on:
      - api

  web:
    build:
      context: ./frontend
      args:
        VITE_ABS_URL: ${ABS_PUBLIC_URL:-}
    image: hearsay-web
    ports:
      - "${HEARSAY_PORT:-47281}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  hearsay-data:
